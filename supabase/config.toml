[functions.ai-insights]
verify_jwt = true

[functions.ai-autocomplete]
verify_jwt = true

[functions.telegram-connect]
verify_jwt = true

# Telegram's servers call this endpoint — no JWT possible; secured by the
# unguessable per-connection `?s=` token that is verified against bot_chats.
[functions.telegram-webhook]
verify_jwt = false

# Android SMS forwarders POST here with the user's webhook_secret. No JWT
# possible; the per-user unguessable webhook_secret authenticates the call.
[functions.sms-ingest]
verify_jwt = false
